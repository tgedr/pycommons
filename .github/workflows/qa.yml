name: quality assurance

env:
  TEST_COVERAGE_THRESHOLD: 100

on:
  push:
    branches:
      - "*"

jobs:
  quality-assurance:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: 'install uv'
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: install requirements
      run: ./helper.sh reqs
    - name: check code linting
      run: ./helper.sh linter_check 
    - name: "run SCA test (safety)"
      run: ./helper.sh sca_check
      env:
        SAFETY_KEY: ${{ secrets.SAFETY_KEY }} 
    - name: "run SAST test (bandit)"
      run: |
        set -o pipefail
        ./helper.sh sast_check
    - name: run unit tests
      run: ./helper.sh test
    - name: check coverage
      run: ./helper.sh test_coverage_check ${{ env.TEST_COVERAGE_THRESHOLD }}
