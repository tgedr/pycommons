[project]
name = "tgedr-pycommons"
version = "1.1.0"
description = "common python code usable across projects"
authors = [
    {name = "joao tiago viegas",email = "3536754+jtviegas@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "numpy<2",
    "fpdf2~=2.8.4",
    "reportlab~=4.4.4",
    "markdown>=3.10.2,<4",
]

[dependency-groups]
dev = [
    "pre-commit~=4.2.0",
    "pytest~=8.3.5",
    "pytest-bdd~=8.1.0",
    "pytest-cov~=4.1.0",
    "pytest-mock~=3.15.0",
    "ruff==0.9.10",
    "bandit==1.8.3",
    "safety==3.5.1",
    "typer<0.17.0",
    "genbadge[coverage]>=1.1.3",
]

# [project.scripts]
# run = "tgedr.pycommons.entrypoint:entrypoint" 

[build-system]
requires = ["uv-build>=0.6,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tgedr_pycommons"
source-include = [
    ".github/**",
    "tests/**",
    ".variables",
    ".bashutils",
    "helper.sh",
    "pyproject.toml",
    "README.md",
    ".gitignore",
    ".pre-commit-config.yaml",
    ".safety-project.ini",
    "uv.lock",
    "release_docs.tar.gz"
]

[tool.coverage.paths]
source = ["src/"]

[tool.coverage.run]
source = ["src/"]
include = ["src/*"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
skip_empty = false

[tool.pytest.ini_options]
pythonpath = "."
# bdd_features_base_dir = "documentation/features"
filterwarnings = [
    "ignore::pytest.PytestWarning",
    "ignore::coverage.exceptions.CoverageWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "tests/",
    "typings/"
]

line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "S101", "D104", "INP001", "D213", "COM812", "I001", 
    "D401", "D407", "RET504", "PLR2004", "FA102", "E501", "EXE002", "PLR0913", 
    "PLR0912", "C901", "PLR0911", "D413", "N818", "B024", "ANN401", "SIM300"]
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
